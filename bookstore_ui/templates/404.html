{% extends "base.html" %}
{% block title %}404 - Page Not Found | BookStore{% endblock %}
{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="my-4">
        <h1 class="display-1 fw-bold text-warning" style="font-family:'Playfair Display',serif">404</h1>
        <h2 class="serif mb-3">Page Not Found</h2>
        <p class="text-muted mb-4">The page or book you are looking for does not exist, has been removed, or is temporarily unavailable.</p>
        <div class="d-flex justify-content-center gap-3">
          <a href="{% url 'home' %}" class="btn-or d-inline-block">Return Home</a>
          <a href="{% url 'books' %}" class="btn btn-outline-secondary d-inline-block">Explore Books</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
